<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="800" viewBox="0 0 1680 800"><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fb"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="1680" height="800" fill="#ffffff"/><text x="40" y="58" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="27" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">End-to-end system architecture</text><text x="40" y="86" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">A true random number generator whose entropy is drawn only from physical processes in bird-chirp audio — no cryptographic conditioning.</text><line x1="40" y1="106" x2="1640" y2="106" stroke="#c7d1da" stroke-width="1.2" stroke-linecap="round"/><rect x="40" y="132" width="470" height="470" rx="14" ry="14" fill="#fbfdff" opacity="1.0" stroke="#c7d1da" stroke-width="1.4"/><rect x="40" y="132" width="470" height="44" rx="14" ry="14" fill="#3d6fa3" opacity="1.0"/><rect x="40" y="162" width="470" height="14" rx="0" ry="0" fill="#3d6fa3" opacity="1.0"/><text x="58" y="161" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.2" opacity="1.0">1 · PHYSICAL ENTROPY SOURCE</text><rect x="58" y="198" width="434" height="82" rx="10" ry="10" fill="#e7eff8" opacity="1.0" stroke="#3d6fa3" stroke-width="1.3"/><text x="74" y="231" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">Bird-chirp field recordings</text><text x="74" y="255" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">xeno-canto · field MP3s · native sample rate</text><rect x="58" y="294" width="434" height="82" rx="10" ry="10" fill="#e7eff8" opacity="1.0" stroke="#3d6fa3" stroke-width="1.3"/><text x="74" y="327" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">ADC quantisation noise</text><text x="74" y="351" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">lowest bits of each 16-bit sample</text><rect x="58" y="390" width="434" height="82" rx="10" ry="10" fill="#e7eff8" opacity="1.0" stroke="#3d6fa3" stroke-width="1.3"/><text x="74" y="423" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">Environmental / acoustic noise</text><text x="74" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">uncorrelated per-channel noise floor</text><rect x="58" y="486" width="434" height="82" rx="10" ry="10" fill="#e7eff8" opacity="1.0" stroke="#3d6fa3" stroke-width="1.3"/><text x="74" y="519" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">Non-stationary vocal content</text><text x="74" y="543" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">song / silence / tonal transitions</text><text x="58" y="578" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">Entropy is microscopic &amp; unpredictable —</text><text x="58" y="596" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">never algorithmic.</text><rect x="546" y="132" width="780" height="470" rx="14" ry="14" fill="#fbfefd" opacity="1.0" stroke="#c7d1da" stroke-width="1.4"/><rect x="546" y="132" width="780" height="44" rx="14" ry="14" fill="#2f8f7f" opacity="1.0"/><rect x="546" y="162" width="780" height="14" rx="0" ry="0" fill="#2f8f7f" opacity="1.0"/><text x="564" y="161" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.2" opacity="1.0">2 · UNCONDITIONED EXTRACTION METHOD</text><rect x="570" y="198" width="732" height="72" rx="10" ry="10" fill="#dcefeb" opacity="1.0" stroke="#2f8f7f" stroke-width="1.4"/><text x="590" y="229" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#1b6257" text-anchor="start" font-weight="bold" opacity="1.0">trim silence</text><text x="590" y="252" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">remove lead-in zeros &amp; tails (no entropy, but biasing)</text><line x1="936.0" y1="270" x2="936.0" y2="277.0" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><polygon points="936.0,286 931.32,277.0 940.68,277.0" fill="#2f8f7f" opacity="1.0"/><rect x="570" y="286" width="732" height="72" rx="10" ry="10" fill="#dcefeb" opacity="1.0" stroke="#2f8f7f" stroke-width="1.4"/><text x="590" y="317" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#1b6257" text-anchor="start" font-weight="bold" opacity="1.0">stereo common-mode rejection</text><text x="590" y="340" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">L ⊕ R cancels shared tone &amp; decoder artefacts</text><line x1="936.0" y1="358" x2="936.0" y2="365.0" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><polygon points="936.0,374 931.32,365.0 940.68,365.0" fill="#2f8f7f" opacity="1.0"/><rect x="570" y="374" width="732" height="72" rx="10" ry="10" fill="#dcefeb" opacity="1.0" stroke="#2f8f7f" stroke-width="1.4"/><text x="590" y="405" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#1b6257" text-anchor="start" font-weight="bold" opacity="1.0">mixed physical extractor</text><text x="590" y="428" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">(y &amp; 1) ⊕ (Δy &amp; 1) ⊕ ((y &gt;&gt; 2) &amp; 1)  per sample</text><line x1="936.0" y1="446" x2="936.0" y2="453.0" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><polygon points="936.0,462 931.32,453.0 940.68,453.0" fill="#2f8f7f" opacity="1.0"/><rect x="570" y="462" width="732" height="72" rx="10" ry="10" fill="#dcefeb" opacity="1.0" stroke="#2f8f7f" stroke-width="1.4"/><text x="590" y="493" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#1b6257" text-anchor="start" font-weight="bold" opacity="1.0">source-health gate  ·  SP 800-90B style</text><text x="590" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">discard low-entropy frames — never transform data</text><rect x="820.0" y="556" width="232" height="30" rx="15" ry="15" fill="#ffffff" opacity="1.0" stroke="#2f8f7f" stroke-width="1.4"/><text x="936.0" y="576" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#1b6257" text-anchor="middle" font-weight="bold" letter-spacing="0.6" opacity="1.0">NO SHA / AES CONDITIONING</text><rect x="1366" y="132" width="274" height="470" rx="14" ry="14" fill="#fdfbff" opacity="1.0" stroke="#c7d1da" stroke-width="1.4"/><rect x="1366" y="132" width="274" height="44" rx="14" ry="14" fill="#7a4b8f" opacity="1.0"/><rect x="1366" y="162" width="274" height="14" rx="0" ry="0" fill="#7a4b8f" opacity="1.0"/><text x="1384" y="161" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.1" opacity="1.0">3 · OUTPUTS &amp; APPLICATION</text><rect x="1384" y="202" width="238" height="40" rx="8" ry="8" fill="#ece3f4" opacity="1.0" stroke="#7a4b8f" stroke-width="1.2"/><text x="1398" y="228" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#57306a" text-anchor="start" font-weight="bold" opacity="1.0">raw bit stream</text><rect x="1384" y="252" width="238" height="40" rx="8" ry="8" fill="#ece3f4" opacity="1.0" stroke="#7a4b8f" stroke-width="1.2"/><text x="1398" y="278" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#57306a" text-anchor="start" font-weight="bold" opacity="1.0">uint32 stream</text><rect x="1384" y="302" width="238" height="40" rx="8" ry="8" fill="#ece3f4" opacity="1.0" stroke="#7a4b8f" stroke-width="1.2"/><text x="1398" y="328" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#57306a" text-anchor="start" font-weight="bold" opacity="1.0">grayscale key image</text><rect x="1384" y="352" width="238" height="40" rx="8" ry="8" fill="#ece3f4" opacity="1.0" stroke="#7a4b8f" stroke-width="1.2"/><text x="1398" y="378" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#57306a" text-anchor="start" font-weight="bold" opacity="1.0">image keystream (XOR)</text><line x1="1503.0" y1="408" x2="1503.0" y2="426.0" stroke="#7a4b8f" stroke-width="1.8" stroke-linecap="round"/><polygon points="1503.0,436 1497.8,426.0 1508.2,426.0" fill="#7a4b8f" opacity="1.0"/><rect x="1384" y="440" width="238" height="82" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#7a4b8f" stroke-width="1.5"/><text x="1503.0" y="470" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#57306a" text-anchor="middle" font-weight="bold" opacity="1.0">encrypt / decrypt</text><text x="1503.0" y="492" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">cipher = plain ⊕ keystream</text><text x="1503.0" y="512" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="middle" font-weight="normal" font-style="italic" opacity="1.0">byte-identical round-trip</text><line x1="512" y1="367" x2="528.0" y2="367.0" stroke="#152230" stroke-width="2.0" stroke-linecap="round"/><polygon points="540,367 528.0,373.24 528.0,360.76" fill="#152230" opacity="1.0"/><line x1="1328" y1="367" x2="1348.0" y2="367.0" stroke="#152230" stroke-width="2.0" stroke-linecap="round"/><polygon points="1360,367 1348.0,373.24 1348.0,360.76" fill="#152230" opacity="1.0"/><rect x="40" y="634" width="1600" height="96" rx="14" ry="14" fill="#f7f9fb" opacity="1.0" stroke="#c7d1da" stroke-width="1.4"/><text x="60" y="668" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">VALIDATION — performed on the RAW, unconditioned bits</text><rect x="64" y="684" width="372" height="34" rx="8" ry="8" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="76" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">SP 800-90B</text><text x="189.0" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">— min-entropy estimate</text><rect x="448" y="684" width="372" height="34" rx="8" ry="8" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="460" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">SP 800-22</text><text x="562.5" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">— monobit · runs · autocorrelation</text><rect x="832" y="684" width="372" height="34" rx="8" ry="8" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="844" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">uniformity</text><text x="957.0" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">— byte histogram, |z| &lt; 3</text><rect x="1216" y="684" width="372" height="34" rx="8" ry="8" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="1228" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#204a70" text-anchor="start" font-weight="bold" opacity="1.0">benchmark</text><text x="1330.5" y="706" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">— throughput vs PRNG / CSPRNG</text><text x="28" y="778" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="bold" opacity="1.0">Fig 1</text><text x="58" y="778" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Figure 1  </text><text x="124.0" y="778" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">Entropy source → method-level extraction → outputs and image-encryption application.</text></svg>