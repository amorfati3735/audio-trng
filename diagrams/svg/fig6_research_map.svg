<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900"><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fb"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="1680" height="900" fill="#ffffff"/><text x="54" y="56" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="26" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Positioning and research map</text><text x="54" y="84" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">How this approach differs from prior art, and how the survey condenses into specific gaps and objectives.</text><line x1="54" y1="104" x2="1626" y2="104" stroke="#c7d1da" stroke-width="1.2" stroke-linecap="round"/><rect x="54" y="128" width="760" height="236" rx="14" ry="14" fill="#f8e1e3" opacity="1.0" stroke="#8a2732" stroke-width="1.5"/><text x="74" y="160" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#8a2732" text-anchor="start" font-weight="bold" opacity="1.0">Conventional hardware TRNG / conditioned RNG</text><rect x="74.0" y="186" width="209.33333333333334" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#8a2732" stroke-width="1.4"/><text x="178.66666666666669" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">physical source</text><text x="178.66666666666669" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">jitter · memristor · optics</text><line x1="289.33333333333337" y1="229" x2="314.33333333333337" y2="229.0" stroke="#8a2732" stroke-width="1.8" stroke-linecap="round"/><polygon points="323.33333333333337,229 314.33333333333337,233.68 314.33333333333337,224.32" fill="#8a2732" opacity="1.0"/><rect x="329.33333333333337" y="186" width="209.33333333333334" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#8a2732" stroke-width="1.4"/><text x="434.00000000000006" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">cryptographic conditioner</text><text x="434.00000000000006" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">SHA-256 · AES-CTR</text><line x1="544.6666666666667" y1="229" x2="569.6666666666667" y2="229.0" stroke="#8a2732" stroke-width="1.8" stroke-linecap="round"/><polygon points="578.6666666666667,229 569.6666666666667,233.68 569.6666666666667,224.32" fill="#8a2732" opacity="1.0"/><rect x="584.6666666666667" y="186" width="209.33333333333334" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#8a2732" stroke-width="1.4"/><text x="689.3333333333334" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">output</text><text x="689.3333333333334" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">random-looking</text><text x="74" y="336" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">The conditioner maps any input to uniform output → the physical source becomes statistically irrelevant and the result is unauditable.</text><rect x="846" y="128" width="780" height="236" rx="14" ry="14" fill="#dcefeb" opacity="1.0" stroke="#1b6257" stroke-width="1.5"/><text x="866" y="160" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#1b6257" text-anchor="start" font-weight="bold" opacity="1.0">This work — unconditioned physical extraction</text><rect x="866.0" y="186" width="216.0" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#1b6257" stroke-width="1.4"/><text x="974.0" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">physical source</text><text x="974.0" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">bird-chirp audio</text><line x1="1088.0" y1="229" x2="1113.0" y2="229.0" stroke="#1b6257" stroke-width="1.8" stroke-linecap="round"/><polygon points="1122.0,229 1113.0,233.68 1113.0,224.32" fill="#1b6257" opacity="1.0"/><rect x="1128.0" y="186" width="216.0" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#1b6257" stroke-width="1.4"/><text x="1236.0" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">method-level extraction</text><text x="1236.0" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">L⊕R · mix · gate</text><line x1="1350.0" y1="229" x2="1375.0" y2="229.0" stroke="#1b6257" stroke-width="1.8" stroke-linecap="round"/><polygon points="1384.0,229 1375.0,233.68 1375.0,224.32" fill="#1b6257" opacity="1.0"/><rect x="1390.0" y="186" width="216.0" height="86" rx="10" ry="10" fill="#ffffff" opacity="1.0" stroke="#1b6257" stroke-width="1.4"/><text x="1498.0" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="middle" font-weight="bold" opacity="1.0">output</text><text x="1498.0" y="248" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#5b6b7a" text-anchor="middle" font-weight="normal" opacity="1.0">raw, traceable</text><text x="866" y="336" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">Every bit is attributable to a measurement; there is no hashing or whitening anywhere in the pipeline.</text><rect x="54" y="420" width="500" height="330" rx="14" ry="14" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.3"/><rect x="54" y="420" width="500" height="40" rx="14" ry="14" fill="#3d6fa3" opacity="1.0"/><rect x="54" y="446" width="500" height="14" rx="0" ry="0" fill="#3d6fa3" opacity="1.0"/><text x="72" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.0" opacity="1.0">LITERATURE THEMES</text><rect x="74" y="484" width="8" height="8" rx="2" ry="2" fill="#3d6fa3" opacity="1.0"/><text x="94" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">1  Physical &amp; acoustic entropy sources</text><rect x="74" y="524" width="8" height="8" rx="2" ry="2" fill="#3d6fa3" opacity="1.0"/><text x="94" y="532" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">2  Extraction, conditioning &amp; validation</text><rect x="74" y="564" width="8" height="8" rx="2" ry="2" fill="#3d6fa3" opacity="1.0"/><text x="94" y="572" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">3  Crypto applications &amp; RNG security</text><text x="72" y="732" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">59 journal papers · 3 themes</text><rect x="590" y="420" width="500" height="330" rx="14" ry="14" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.3"/><rect x="590" y="420" width="500" height="40" rx="14" ry="14" fill="#c08a2b" opacity="1.0"/><rect x="590" y="446" width="500" height="14" rx="0" ry="0" fill="#c08a2b" opacity="1.0"/><text x="608" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.0" opacity="1.0">RESEARCH GAPS</text><rect x="610" y="484" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G1  no conditioning-free commodity source</text><rect x="610" y="524" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="532" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G2  common-mode correlation ignored</text><rect x="610" y="564" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="572" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G3  weak estimation for non-stationary audio</text><rect x="610" y="604" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="612" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G4  validation usually post-conditioning</text><rect x="610" y="644" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="652" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G5  chaos keystreams broken by CPA</text><rect x="610" y="684" width="8" height="8" rx="2" ry="2" fill="#c08a2b" opacity="1.0"/><text x="630" y="692" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">G6  throughput rarely benchmarked</text><text x="608" y="732" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">6 gaps, each traced to specific papers</text><rect x="1126" y="420" width="500" height="330" rx="14" ry="14" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.3"/><rect x="1126" y="420" width="500" height="40" rx="14" ry="14" fill="#7a4b8f" opacity="1.0"/><rect x="1126" y="446" width="500" height="14" rx="0" ry="0" fill="#7a4b8f" opacity="1.0"/><text x="1144" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="start" font-weight="bold" letter-spacing="1.0" opacity="1.0">OBJECTIVES</text><rect x="1146" y="484" width="8" height="8" rx="2" ry="2" fill="#7a4b8f" opacity="1.0"/><text x="1166" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">O1  source characterisation  ≥7.5 b/byte</text><rect x="1146" y="524" width="8" height="8" rx="2" ry="2" fill="#7a4b8f" opacity="1.0"/><text x="1166" y="532" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">O2  SP 800-22 ≥98% on raw bits</text><rect x="1146" y="564" width="8" height="8" rx="2" ry="2" fill="#7a4b8f" opacity="1.0"/><text x="1166" y="572" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">O3  throughput ≥20 kbit/s vs PRNG</text><rect x="1146" y="604" width="8" height="8" rx="2" ry="2" fill="#7a4b8f" opacity="1.0"/><text x="1166" y="612" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#152230" text-anchor="start" font-weight="normal" opacity="1.0">O4  encryption NPCR≥99.6%, corr≤0.01</text><text x="1144" y="732" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">4 measurable outcomes</text><line x1="556" y1="585" x2="577.0" y2="585.0" stroke="#152230" stroke-width="2.0" stroke-linecap="round"/><polygon points="588,585 577.0,590.72 577.0,579.28" fill="#152230" opacity="1.0"/><line x1="1092" y1="585" x2="1113.0" y2="585.0" stroke="#152230" stroke-width="2.0" stroke-linecap="round"/><polygon points="1124,585 1113.0,590.72 1113.0,579.28" fill="#152230" opacity="1.0"/><text x="28" y="878" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="bold" opacity="1.0">Fig 6</text><text x="58" y="878" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Figure 6  </text><text x="124.0" y="878" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">Prior-art contrast (top) and the survey → gaps → objectives logic (bottom).</text></svg>