<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720"><defs><linearGradient id="wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fb"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="1500" height="720" fill="#ffffff"/><text x="54" y="56" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="26" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Entropy extraction, sample by sample</text><text x="54" y="84" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">One 16-bit sample: the top bits carry the chirp's shape; the low bits carry ADC &amp; environmental noise.</text><line x1="54" y1="104" x2="1446" y2="104" stroke="#c7d1da" stroke-width="1.2" stroke-linecap="round"/><text x="90" y="134" font-family="DejaVu Sans Mono, monospace" font-size="14.5" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">16-bit sample  y  =  0b0011010100101101</text><rect x="90" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="110.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="136" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="156.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="182" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="202.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="228" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="248.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="274" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="294.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="320" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="340.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="366" y="150" width="40" height="52" rx="5" ry="5" fill="#e7eff8" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="386.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="412" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="432.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="458" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="478.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="504" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="524.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="550" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="570.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="596" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="616.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="642" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="662.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="688" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="708.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><rect x="734" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="754.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><rect x="780" y="150" width="40" height="52" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="800.0" y="184" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><text x="228" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#204a70" text-anchor="middle" font-weight="bold" opacity="1.0">signal-shaped bits</text><text x="619.0" y="224" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#1b6257" text-anchor="middle" font-weight="bold" opacity="1.0">noise-rich bits (entropy)</text><line x1="409" y1="144" x2="409" y2="210" stroke="#c7d1da" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="90" y="300" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Three complementary physical views</text><text x="90" y="348" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">a = y &amp; 1</text><text x="250" y="348" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">raw LSB</text><rect x="430" y="326" width="40" height="34" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="450" y="350" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><line x1="486" y1="343" x2="513.0" y2="343.0" stroke="#5b6b7a" stroke-width="1.4" stroke-linecap="round"/><polygon points="520,343 513.0,346.64 513.0,339.36" fill="#5b6b7a" opacity="1.0"/><text x="90" y="406" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">b = Δy &amp; 1</text><text x="250" y="406" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">LSB of first difference</text><rect x="430" y="384" width="40" height="34" rx="5" ry="5" fill="#ffffff" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="450" y="408" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">0</text><line x1="486" y1="401" x2="513.0" y2="401.0" stroke="#5b6b7a" stroke-width="1.4" stroke-linecap="round"/><polygon points="520,401 513.0,404.64 513.0,397.36" fill="#5b6b7a" opacity="1.0"/><text x="90" y="464" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">c = (y &gt;&gt; 2) &amp; 1</text><text x="250" y="464" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">shifted bit-plane LSB</text><rect x="430" y="442" width="40" height="34" rx="5" ry="5" fill="#dcefeb" opacity="1.0" stroke="#c7d1da" stroke-width="1.2"/><text x="450" y="466" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#152230" text-anchor="middle" font-weight="normal" opacity="1.0">1</text><line x1="486" y1="459" x2="513.0" y2="459.0" stroke="#5b6b7a" stroke-width="1.4" stroke-linecap="round"/><polygon points="520,459 513.0,462.64 513.0,455.36" fill="#5b6b7a" opacity="1.0"/><text x="560" y="368" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">Each view alone is biased by the tone /</text><text x="560" y="388" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">decoder; their XOR cancels it.</text><path d="M 620 402 C 664 388 706 406 716 440 C 724 470 672 478 620 478 Z" fill="#ffffff" stroke="#7a4b8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="586" y1="420" x2="626" y2="420" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><line x1="586" y1="442" x2="624" y2="442" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><line x1="624" y1="442" x2="666" y2="460" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><line x1="586" y1="464" x2="628" y2="464" stroke="#2f8f7f" stroke-width="1.8" stroke-linecap="round"/><text x="650" y="448" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57306a" text-anchor="middle" font-weight="bold" opacity="1.0">XOR</text><line x1="724" y1="440" x2="778.0" y2="440.0" stroke="#7a4b8f" stroke-width="1.8" stroke-linecap="round"/><polygon points="788,440 778.0,445.2 778.0,434.8" fill="#7a4b8f" opacity="1.0"/><rect x="790" y="416" width="66" height="48" rx="8" ry="8" fill="#ece3f4" opacity="1.0" stroke="#7a4b8f" stroke-width="1.6"/><text x="823" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57306a" text-anchor="middle" font-weight="bold" opacity="1.0">1 bit</text><text x="870" y="447" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" font-style="italic" opacity="1.0">≈ uniform</text><rect x="90" y="560" width="1320" height="84" rx="12" ry="12" fill="#f7f9fb" opacity="1.0" stroke="#c7d1da" stroke-width="1.3"/><text x="112" y="594" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Output bit per sample</text><text x="112" y="620" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#1b6257" text-anchor="start" font-weight="normal" opacity="1.0">= (y &amp; 1) ⊕ (Δy &amp; 1) ⊕ ((y &gt;&gt; 2) &amp; 1)</text><text x="1388" y="594" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#57306a" text-anchor="end" font-weight="bold" opacity="1.0">No hashing · no whitening</text><text x="1388" y="620" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="end" font-weight="normal" font-style="italic" opacity="1.0">every bit traceable to a measurement</text><text x="28" y="698" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="bold" opacity="1.0">Fig 3</text><text x="58" y="698" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#152230" text-anchor="start" font-weight="bold" opacity="1.0">Figure 3  </text><text x="124.0" y="698" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#5b6b7a" text-anchor="start" font-weight="normal" opacity="1.0">Mixing three biased views yields a near-uniform physical bit.</text></svg>